<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10152f">
  <title>RAMEN MASTER • Midnight kitchen</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b19;color:#ffe4b4}body{display:grid;place-items:center;font-family:monospace}canvas{display:block;width:min(100vw,150vh);height:auto;max-height:100vh;image-rendering:pixelated;outline:none;touch-action:none}#err:empty{display:none}#err{position:fixed;bottom:0;left:0;padding:14px;background:#a12444;color:white;white-space:pre-wrap;z-index:2}
  </style>
</head>
<body>
  <canvas id="game" width="1200" height="800" tabindex="0" aria-label="Ramen Master cooking game. Number keys add ingredients, arrows choose orders, E serves. Enter starts."></canvas>
  <div id="err" role="alert"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
